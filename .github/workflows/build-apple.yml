name: Build Apple & Android Releases (macOS Universal, iOS Swift & Android APK/AAB)

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-android:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.7'

      - name: Build Signed Android APK & Google Play AAB + Run JUnit Tests
        run: |
          chmod +x ./scripts/build-android.sh
          ./scripts/build-android.sh

      - name: Upload Android Artifacts (.apk & .aab) to GitHub Release v1.0.0
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload v1.0.0 \
            dist/VuiKey-1.0.0-android.apk \
            dist/VuiKey-1.0.0-android-playstore.aab \
            --clobber

  build-macos:
    runs-on: macos-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'

      - name: Build macOS Universal App (.app, .zip, .dmg) & Run Swift Tests
        run: |
          chmod +x ./scripts/build-apple.sh
          ./scripts/build-apple.sh

      - name: Upload macOS Artifacts to GitHub Release v1.0.0
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload v1.0.0 \
            dist/VuiKey-1.0.0-macos-universal.dmg \
            dist/VuiKey-1.0.0-macos-universal.zip \
            --clobber
