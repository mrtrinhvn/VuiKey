  <rect x="50" y="195" width="350" height="135" rx="14" fill="#1e293b" stroke="#10b981" stroke-width="1.5"/>
  <text x="72" y="230" fill="#10b981" font-family="Inter, Ubuntu, sans-serif" font-size="18" font-weight="bold">1. Chống Nhân Đôi &amp; Mất Chữ</text>
  <text x="72" y="260" fill="#cbd5e1" font-family="Inter, Ubuntu, sans-serif" font-size="14">• Không giữ bộ đệm gạch chân dài</text>
  <text x="72" y="284" fill="#cbd5e1" font-family="Inter, Ubuntu, sans-serif" font-size="14">• Ấn Delete / Backspace không bao giờ</text>
  <text x="72" y="306" fill="#cbd5e1" font-family="Inter, Ubuntu, sans-serif" font-size="14">  nhảy đúp chữ trên trình duyệt &amp; IDE</text>

  <rect x="425" y="195" width="350" height="135" rx="14" fill="#1e293b" stroke="#38bdf8" stroke-width="1.5"/>
  <text x="447" y="230" fill="#38bdf8" font-family="Inter, Ubuntu, sans-serif" font-size="18" font-weight="bold">2. Gõ Tự Do &amp; Tách Âm Tiết</text>
  <text x="447" y="260" fill="#cbd5e1" font-family="Inter, Ubuntu, sans-serif" font-size="14">• Gõ tự do: dodongj ➔ động, 5 kiểu ươ</text>
  <text x="447" y="284" fill="#cbd5e1" font-family="Inter, Ubuntu, sans-serif" font-size="14">• Tự tách chuỗi dính liền không cách</text>
  <text x="447" y="306" fill="#cbd5e1" font-family="Inter, Ubuntu, sans-serif" font-size="14">• Sửa chữ bằng Backspace ăn dấu ngay</text>

  <rect x="800" y="195" width="350" height="135" rx="14" fill="#1e293b" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="822" y="230" fill="#fde047" font-family="Inter, Ubuntu, sans-serif" font-size="18" font-weight="bold">3. Smart English Guard</text>
  <text x="822" y="260" fill="#cbd5e1" font-family="Inter, Ubuntu, sans-serif" font-size="14">• Tự giữ nguyên từ Tiếng Anh: window,</text>
  <text x="822" y="284" fill="#cbd5e1" font-family="Inter, Ubuntu, sans-serif" font-size="14">  view, test, server, linux, docker...</text>
  <text x="822" y="306" fill="#cbd5e1" font-family="Inter, Ubuntu, sans-serif" font-size="14">• Không cần tắt Tiếng Việt khi gõ xen kẽ</text>

