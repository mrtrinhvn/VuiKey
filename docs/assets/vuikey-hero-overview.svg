<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="50%" stop-color="#1e1b4b"/>
      <stop offset="100%" stop-color="#090d16"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="420" rx="20" fill="url(#bg)" stroke="#334155" stroke-width="2"/>
  
  <!-- Header Badge -->
  <rect x="50" y="36" width="720" height="34" rx="17" fill="#1e293b" stroke="#38bdf8" stroke-width="1.5"/>
  <text x="70" y="58" fill="#38bdf8" font-family="Inter, Ubuntu, sans-serif" font-size="14" font-weight="bold">⚡ NEXT-GEN VIETNAMESE INPUT ENGINE • MACOS • IOS • ANDROID • WINDOWS • LINUX</text>

  <!-- Main Title -->
  <text x="50" y="120" fill="#f8fafc" font-family="Inter, Ubuntu, sans-serif" font-size="52" font-weight="900">VuiKey Studio 🇻🇳</text>
  <text x="50" y="162" fill="#94a3b8" font-family="Inter, Ubuntu, sans-serif" font-size="19.5">Giải Quyết Dứt Điểm Những Nỗi Đau Gõ Tiếng Việt Tồn Tại Nhiều Năm Trên Mac, iOS, Android, Windows &amp; Linux</text>

